# nginx-mcp.conf
# Ajoute ce bloc dans ton server { ... } HTTPS existant sur workspace.srv1570727.hstgr.cloud
# IMPORTANT: place ces locations AVANT le bloc "location / { ... }" de ton app

# Endpoint SSE — Claude Desktop se connecte ici
location /mcp-sse {
    proxy_pass         http://127.0.0.1:3001/sse;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # OBLIGATOIRE pour que SSE fonctionne (désactive le buffering)
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    keepalive_timeout  86400s;

    # CORS si Claude Desktop en a besoin
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "Authorization, x-mcp-secret, Content-Type" always;
}

# Endpoint POST pour les messages MCP
location /mcp-msg {
    proxy_pass         http://127.0.0.1:3001/message;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "Authorization, x-mcp-secret, Content-Type" always;
}

# Health check (optionnel, pour monitoring)
location /mcp-health {
    proxy_pass http://127.0.0.1:3001/health;
}
